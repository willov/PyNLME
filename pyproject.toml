[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynlme"
version = "0.5.0"
description = "Nonlinear mixed-effects models for Python with MATLAB nlmefit/nlmefitsa syntax"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "William Lövfors", email = "william.lovfors@liu.se"},
]
keywords = ["statistics", "mixed-effects", "nonlinear", "nlme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "matplotlib>=3.0",
    "pandas>=1.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "coverage[toml]>=7.0",
    "pytest-cov>=4.0",
]
sund = [
    "sund>=2.5",
]
benchmark = [
    "psutil>=5.9.0",
    "seaborn>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/willov/PyNLME"
Repository = "https://github.com/willov/PyNLME"
Documentation = "https://github.com/willov/PyNLME/blob/main/docs/README.md"
Issues = "https://github.com/willov/PyNLME/issues"
Changelog = "https://github.com/willov/PyNLME/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pynlme"]

[tool.uv.sources]
pynlme = { workspace = true }

[dependency-groups]
dev = [
    "matplotlib>=3.10.3",
    "pandas>=2.3.0",
    "polars>=1.44.2",
    "psutil>=7.0.0",
    "pynlme",
    "pyqt6>=6.9.1",
    "pytest>=8.3.5",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.coverage.run]
source = ["src/pynlme"]
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # long lines (mostly comments) are fine; the formatter handles code
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # Allow useless expressions in tests
"examples/*" = ["B018", "F841"]  # Allow useless expressions and unused variables in examples
