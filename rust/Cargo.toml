[package]
name = "pynlme_kernels"
version = "0.1.0"
edition = "2021"
description = "Compiled kernels for pynlme (Lindstrom-Bates inner loops)"
license = "MIT"

[lib]
name = "_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py311"] }
numpy = "0.27"

[profile.release]
lto = true
codegen-units = 1
