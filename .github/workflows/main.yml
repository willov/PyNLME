name: CI/CD Pipeline

# Tests on pushes and pull requests. A release runs only for a pushed tag vX.Y.Z on
# main (made by scripts/release.py): check the tag, test, build the wheels and
# sdist, create the GitHub release and publish to PyPI (after approval in the
# "pypi" environment).
on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (builds the Rust kernels; with SUND)
        run: uv sync --dev --extra sund

      - name: Check import and kernels
        run: |
          uv run python -c "import pynlme, pynlme._kernels; print(f'pynlme version: {pynlme.__version__}')"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests without the kernels (NumPy code)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run pytest tests/ -q --tb=short
        env:
          PYNLME_KERNELS: "0"

      - name: Type checking (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run mypy src/pynlme/ --ignore-missing-imports || true

  # Validation against R: randomized comparison with nlme and simulation studies.
  # Slow, so only when started by hand (Actions -> CI/CD Pipeline -> Run workflow).
  validation:
    name: Validate against R nlme
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e 'install.packages(c("nlme", "jsonlite"), repos = "https://cloud.r-project.org")'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --dev --extra sund

      - name: Validation tests
        run: uv run pytest tests/validation -v --tb=short --runslow
        env:
          PYNLME_RANDOM_N: "10"

  # The tag must name pyproject.toml's version and point to a commit on main.
  release-check:
    name: Check the release tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches the version, commit is on main
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml's version $VERSION"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # One abi3 wheel per platform (Python 3.11+, with the compiled Rust kernels).
  build-wheels:
    name: Build wheel for ${{ matrix.target }} on ${{ matrix.os }}
    needs: [release-check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: [release-check, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # GitHub release (pre-release) with the wheels, the sdist and the changelog section.
  github-release:
    name: Create GitHub release
    needs: [release-check, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.release-check.outputs.version }}"
          awk "/^## \[?v?$VERSION\]?/ {flag=1; next} /^## \[?v?[0-9]/ {flag=0} flag" \
            CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/willov/pynlme/blob/main/CHANGELOG.md)." \
              > release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: pynlme v${{ needs.release-check.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          prerelease: true
          fail_on_unmatched_files: true

  # PyPI by trusted publishing (no token): the PyPI project trusts this workflow
  # (main.yml) in the environment "pypi", whose required reviewer approves the upload.
  publish-pypi:
    name: Publish to PyPI
    needs: [release-check, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pynlme/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
