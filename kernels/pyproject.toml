[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pynlme-kernels"
version = "0.1.0"
description = "Optional compiled kernels for pynlme (Lindstrom-Bates inner loops)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0"]

[tool.maturin]
module-name = "pynlme_kernels"
